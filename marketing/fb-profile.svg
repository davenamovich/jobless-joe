    <path d="M64 186 L64 196" stroke="#111" stroke-width="2.6"/>
  </g>

  <!-- name plate -->
  <rect x="150" y="552" width="420" height="82" rx="41" fill="#0d0a14" stroke="#f2c14e" stroke-width="3"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="360" y="612" font-size="64" font-weight="bold" fill="#000" opacity="0.5" transform="translate(3 4)">Jobless Joe</text>
    <text x="360" y="612" font-size="64" font-weight="bold" fill="url(#gold)" stroke="#5c3a07" stroke-width="1.5">Jobless Joe</text>
  </g>
