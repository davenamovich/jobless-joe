    </g>
  </g>

  <!-- Stickman Joe, "sing" pose, smug, scaled 2.4x -->
  <g transform="translate(323 20) scale(2.4)" stroke="#111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 392 L64 182" stroke="#d9dde3" stroke-width="4"/>
    <path d="M1.8 140 L0 290" stroke="#f5f1e6" stroke-width="6"/>
    <path d="M-4.2 144 L7.8 144 L5.8 154 L10.8 194 L1.8 206 L-7.2 194 L-2.2 154 Z" fill="#d6283b" stroke="#111" stroke-width="2"/>
