<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- YouTube safe area (shown on every device): 1546x423 centred, x 507-2053, y 508-931 -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#2a1f3d"/>
      <stop offset="0.55" stop-color="#15111f"/>
      <stop offset="1" stop-color="#0a0810"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c0d16"/>
      <stop offset="0.25" stop-color="#9b1b2a"/>
      <stop offset="0.5" stop-color="#6e1019"/>
      <stop offset="0.75" stop-color="#a51f2f"/>
      <stop offset="1" stop-color="#5c0d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#c98a1c"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#140d08"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>

  <!-- curtains (only visible on TV / wide desktop) -->
  <path d="M0 0 L300 0 Q250 500 330 900 Q370 1200 280 1440 L0 1440 Z" fill="url(#curtain)"/>
  <path d="M2560 0 L2260 0 Q2310 500 2230 900 Q2190 1200 2280 1440 L2560 1440 Z" fill="url(#curtain)"/>
  <path d="M0 0 L2560 0 L2560 150 Q2400 200 2240 150 Q2080 200 1920 150 Q1760 200 1600 150 Q1440 200 1280 150 Q1120 200 960 150 Q800 200 640 150 Q480 200 320 150 Q160 200 0 150 Z" fill="#7d1421"/>
  <path d="M0 150 Q160 200 320 150 Q480 200 640 150 Q800 200 960 150 Q1120 200 1280 150 Q1440 200 1600 150 Q1760 200 1920 150 Q2080 200 2240 150 Q2400 200 2560 150" fill="none" stroke="url(#gold)" stroke-width="6"/>

  <!-- stage floor just under the safe area -->
  <rect x="0" y="940" width="2560" height="500" fill="url(#stage)"/>
  <line x1="0" y1="940" x2="2560" y2="940" stroke="#f2c14e" stroke-opacity="0.5" stroke-width="3"/>

  <!-- spotlight -->
  <path d="M1690 150 L1580 942 L1980 942 L1770 150 Z" fill="url(#beam)"/>
  <ellipse cx="1780" cy="942" rx="250" ry="34" fill="url(#pool)"/>

  <!-- notes -->
  <g fill="#f2c14e" stroke="#f2c14e" stroke-width="6" stroke-linecap="round">
    <g transform="translate(1960 560) rotate(12)">
      <ellipse cx="0" cy="44" rx="16" ry="11" stroke="none"/><line x1="13" y1="42" x2="13" y2="-6"/><path d="M13 -6 Q33 5 29 24" fill="none"/>
    </g>
    <g transform="translate(1950 720) rotate(-10)" opacity="0.8">
      <ellipse cx="0" cy="34" rx="12" ry="9" stroke="none"/><ellipse cx="36" cy="26" rx="12" ry="9" stroke="none"/>
      <line x1="10" y1="32" x2="10" y2="-4"/><line x1="46" y1="24" x2="46" y2="-12"/><line x1="10" y1="-4" x2="46" y2="-12" stroke-width="9"/>
    </g>
    <g transform="translate(1580 560) rotate(-14)" opacity="0.65">
      <ellipse cx="0" cy="32" rx="11" ry="8" stroke="none"/><line x1="9" y1="30" x2="9" y2="-6"/><path d="M9 -6 Q24 2 21 18" fill="none"/>
    </g>
  </g>

  <!-- Stickman Joe, scaled 1.2x, feet on y=940 (head top ~y 543, inside safe area) -->
  <g transform="translate(1750 470) scale(1.2)" stroke="#111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 392 L64 182" stroke="#d9dde3" stroke-width="5"/>
    <path d="M42 392 L86 392" stroke="#d9dde3" stroke-width="6"/>
    <path d="M1.8 140 L0 268" stroke="#f5f1e6" stroke-width="7"/>
    <path d="M-4.2 144 L7.8 144 L5.8 154 L10.8 194 L1.8 206 L-7.2 194 L-2.2 154 Z" fill="#d6283b" stroke="#111" stroke-width="2.5"/>
    <path d="M0 168 L-40 196 L-66 168" stroke="#f5f1e6" stroke-width="7"/>
    <path d="M0 168 L30 200 L52 178" stroke="#f5f1e6" stroke-width="7"/>
    <path d="M0 268 L-12 330 L-20 392" stroke="#f5f1e6" stroke-width="7"/>
    <path d="M0 268 L12 330 L20 392" stroke="#f5f1e6" stroke-width="7"/>
    <circle cx="3" cy="108" r="32" fill="#fff" stroke="#111" stroke-width="5"/>
    <g transform="translate(3 108)" stroke-width="3">
      <path d="M-16 -4 L-6 -6"/>
      <circle cx="11" cy="-5" r="3.6" fill="#111" stroke="none"/>
      <path d="M5 -16 L17 -20"/>
      <path d="M-8 13 Q4 16 12 6"/>
    </g>
    <rect x="55" y="160" width="18" height="26" rx="9" fill="#9ca3af" stroke="#111" stroke-width="2.5"/>
    <path d="M64 186 L64 196" stroke="#111" stroke-width="3"/>
  </g>

  <!-- title block inside the safe area -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="1080" y="575" font-size="30" letter-spacing="6" fill="#f2c14e" font-style="italic">SONGS · STICKMAN VIDEOS · MEME ENGINE</text>
    <text x="1080" y="725" font-size="160" font-weight="bold" fill="#000" opacity="0.45" transform="translate(6 7)">Jobless Joe</text>
    <text x="1080" y="725" font-size="160" font-weight="bold" fill="url(#gold)" stroke="#5c3a07" stroke-width="2">Jobless Joe</text>
    <line x1="790" y1="768" x2="1370" y2="768" stroke="#f2c14e" stroke-width="2" stroke-opacity="0.7"/>
    <text x="1080" y="828" font-size="48" font-style="italic" fill="#f8efe0">A Stick Figure Crooner</text>
    <text x="1080" y="895" font-size="30" letter-spacing="1" fill="#f2c14e">plunderandriffle.com/joblessjoe</text>
  </g>
</svg>
