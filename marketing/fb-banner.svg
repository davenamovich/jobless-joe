<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
  <defs>
    <radialGradient id="bg" cx="0.68" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#2a1f3d"/>
      <stop offset="0.55" stop-color="#15111f"/>
      <stop offset="1" stop-color="#0a0810"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c0d16"/>
      <stop offset="0.25" stop-color="#9b1b2a"/>
      <stop offset="0.5" stop-color="#6e1019"/>
      <stop offset="0.75" stop-color="#a51f2f"/>
      <stop offset="1" stop-color="#5c0d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#c98a1c"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#140d08"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1640" height="624" fill="url(#bg)"/>

  <!-- marquee bulbs across the top -->
  <g fill="#ffd36b">
    <circle cx="60" cy="22" r="5"/><circle cx="140" cy="22" r="5"/><circle cx="220" cy="22" r="5"/><circle cx="300" cy="22" r="5"/>
    <circle cx="380" cy="22" r="5"/><circle cx="460" cy="22" r="5"/><circle cx="540" cy="22" r="5"/><circle cx="620" cy="22" r="5"/>
    <circle cx="700" cy="22" r="5"/><circle cx="780" cy="22" r="5"/><circle cx="860" cy="22" r="5"/><circle cx="940" cy="22" r="5"/>
    <circle cx="1020" cy="22" r="5"/><circle cx="1100" cy="22" r="5"/><circle cx="1180" cy="22" r="5"/><circle cx="1260" cy="22" r="5"/>
    <circle cx="1340" cy="22" r="5"/><circle cx="1420" cy="22" r="5"/><circle cx="1500" cy="22" r="5"/><circle cx="1580" cy="22" r="5"/>
  </g>

  <!-- side curtains -->
  <path d="M0 0 L120 0 Q96 200 130 380 Q150 520 104 624 L0 624 Z" fill="url(#curtain)"/>
  <path d="M1640 0 L1520 0 Q1544 200 1510 380 Q1490 520 1536 624 L1640 624 Z" fill="url(#curtain)"/>
  <path d="M0 0 L1640 0 L1640 46 Q1500 70 1360 46 Q1230 70 1100 46 Q960 70 820 46 Q680 70 540 46 Q410 70 280 46 Q140 70 0 46 Z" fill="#7d1421"/>
  <path d="M0 46 Q140 70 280 46 Q410 70 540 46 Q680 70 820 46 Q960 70 1100 46 Q1230 70 1360 46 Q1500 70 1640 46" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- stage floor -->
  <rect x="0" y="560" width="1640" height="64" fill="url(#stage)"/>
  <line x1="0" y1="560" x2="1640" y2="560" stroke="#f2c14e" stroke-opacity="0.5" stroke-width="2"/>

  <!-- spotlight on Joe -->
  <path d="M1175 46 L1075 562 L1385 562 L1235 46 Z" fill="url(#beam)"/>
  <ellipse cx="1230" cy="562" rx="190" ry="26" fill="url(#pool)"/>

  <!-- floating notes -->
  <g fill="#f2c14e" stroke="#f2c14e" stroke-width="5" stroke-linecap="round">
    <g transform="translate(1385 170) rotate(12)">
      <ellipse cx="0" cy="40" rx="14" ry="10" stroke="none"/><line x1="12" y1="38" x2="12" y2="-6"/><path d="M12 -6 Q30 4 26 22" fill="none"/>
    </g>
    <g transform="translate(1440 300) rotate(-10)" opacity="0.8">
      <ellipse cx="0" cy="34" rx="12" ry="9" stroke="none"/><ellipse cx="36" cy="26" rx="12" ry="9" stroke="none"/>
      <line x1="10" y1="32" x2="10" y2="-4"/><line x1="46" y1="24" x2="46" y2="-12"/><line x1="10" y1="-4" x2="46" y2="-12" stroke-width="9"/>
    </g>
    <g transform="translate(1080 120) rotate(-14)" opacity="0.65">
      <ellipse cx="0" cy="32" rx="11" ry="8" stroke="none"/><line x1="9" y1="30" x2="9" y2="-6"/><path d="M9 -6 Q24 2 21 18" fill="none"/>
    </g>
  </g>

  <!-- Stickman Joe (house rig, "sing" pose, smug), scaled 1.4x, ground at y=560 -->
  <g transform="translate(1195 11) scale(1.4)" stroke="#111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- mic stand -->
    <path d="M64 392 L64 182" stroke="#d9dde3" stroke-width="5"/>
    <path d="M42 392 L86 392" stroke="#d9dde3" stroke-width="6"/>
    <!-- body -->
    <path d="M1.8 140 L0 268" stroke="#f5f1e6" stroke-width="7"/>
    <!-- tie -->
    <path d="M-4.2 144 L7.8 144 L5.8 154 L10.8 194 L1.8 206 L-7.2 194 L-2.2 154 Z" fill="#d6283b" stroke="#111" stroke-width="2.5"/>
    <!-- arms -->
    <path d="M0 168 L-40 196 L-66 168" stroke="#f5f1e6" stroke-width="7"/>
    <path d="M0 168 L30 200 L52 178" stroke="#f5f1e6" stroke-width="7"/>
    <!-- legs -->
    <path d="M0 268 L-12 330 L-20 392" stroke="#f5f1e6" stroke-width="7"/>
    <path d="M0 268 L12 330 L20 392" stroke="#f5f1e6" stroke-width="7"/>
    <!-- head -->
    <circle cx="3" cy="108" r="32" fill="#fff" stroke="#111" stroke-width="5"/>
    <!-- smug face -->
    <g transform="translate(3 108)" stroke-width="3">
      <path d="M-16 -4 L-6 -6"/>
      <circle cx="11" cy="-5" r="3.6" fill="#111" stroke="none"/>
      <path d="M5 -16 L17 -20"/>
      <path d="M-8 13 Q4 16 12 6"/>
    </g>
    <!-- mic head -->
    <rect x="55" y="160" width="18" height="26" rx="9" fill="#9ca3af" stroke="#111" stroke-width="2.5"/>
    <path d="M64 186 L64 196" stroke="#111" stroke-width="3"/>
  </g>

  <!-- title block -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="575" y="150" font-size="30" letter-spacing="6" fill="#f2c14e" font-style="italic">SONGS · STICKMAN VIDEOS · MEME ENGINE</text>
    <text x="575" y="300" font-size="150" font-weight="bold" fill="#000" opacity="0.45" transform="translate(6 7)">Jobless Joe</text>
    <text x="575" y="300" font-size="150" font-weight="bold" fill="url(#gold)" stroke="#5c3a07" stroke-width="2">Jobless Joe</text>
    <line x1="295" y1="345" x2="855" y2="345" stroke="#f2c14e" stroke-width="2" stroke-opacity="0.7"/>
    <text x="575" y="405" font-size="46" font-style="italic" fill="#f8efe0">A Stick Figure Crooner</text>
    <text x="575" y="462" font-size="24" letter-spacing="4" fill="#cdbfd9">MUSIC &amp; MEMES FOR THE RECENTLY UNEMPLOYED</text>
    <rect x="335" y="490" width="480" height="46" rx="23" fill="none" stroke="#f2c14e" stroke-width="2" stroke-opacity="0.8"/>
    <text x="575" y="522" font-size="26" letter-spacing="1" fill="#f2c14e">plunderandriffle.com/joblessjoe</text>
  </g>
</svg>
