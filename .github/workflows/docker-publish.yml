# =============================================================================
# Jobless Joe — Build, test, sign, and publish Docker image to GHCR
# =============================================================================
#
# PIPELINE OVERVIEW
# -----------------
#
#   ┌──────────────┐   ┌──────────────┐        ┌──────────────┐
#   │ build amd64  │   │ build arm64  │        │              │
#   │ ubuntu-latest│   │ ubuntu-24.04 │───▶────│    merge     │
#   └──────────────┘   │     -arm     │        │ (manifest)   │
#                      └──────────────┘        └──────┬───────┘
#                                                     │
#                 ┌────────────┐   ┌──────────┐   ┌───▼──────┐
#                 │ smoke-test │──▶│   sign   │──▶│ release  │
#                 │ (boot+curl)│   │ (cosign) │   │ (notes)  │
#                 └────────────┘   └──────────┘   └──────────┘
#
# arm64 is built on GitHub's native arm64 runner (free for public repos)
# instead of QEMU emulation. The emulated build took over an hour; native
# builds finish in single-digit minutes.
#
# TRIGGERS
# --------
#  - Push a tag matching `v*` → builds + tests + signs + creates GitHub release
#  - Push to main branch       → builds + tests + signs as :edge
#  - Manual workflow_dispatch  → builds + tests + signs as :edge
#  - Pull request              → builds, does NOT push/sign/smoke-test
#
# WHAT IT PRODUCES (on tag push)
# ------------------------------
#  - ghcr.io/<owner>/jobless-joe:latest        (multi-arch)
#  - ghcr.io/<owner>/jobless-joe:v1.0.0         (multi-arch)
#  - cosign signature attached to the image    (keyless, sigstore)
#  - GitHub Release with auto-generated notes  (draft=false, public)
#
# SECURITY
# --------
#  - Image is signed with cosign in "keyless" mode using Sigstore's Fulcio CA.
#  - Signatures are stored in a rekor transparency log (rekor.sigstore.dev).
#  - End users can verify with `cosign verify` (see docs/PUBLISHING.md).
# =============================================================================

name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "Dockerfile"
      - "next.config.ts"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (defaults to current branch)"
        required: false
        default: ""

# We need id-token:write for cosign keyless signing (Sigstore OIDC).
# We need contents:write for the release job to create GitHub releases.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jobless-joe

jobs:
  # ===========================================================================
  # Jobs 1a/1b: Build each architecture natively and push by digest.
  # Producing a digest (rather than a tag) lets the merge job assemble one
  # multi-arch manifest without either platform racing the other.
  # ===========================================================================
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Jobless Joe
            org.opencontainers.image.description=The Crooner Song Engine — comedy-driven song generator for Jobless Joe's Bootcamp
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs only verify that the image builds; nothing is pushed.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-arch cache refs: two jobs writing one cache tag would race.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Job 2: Merge the per-arch digests into one multi-arch manifest and apply
  # the release tags (:latest / :v1.0.0 / :edge) to it.
  # ===========================================================================
  merge:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          count=$(find /tmp/digests -type f | wc -l | tr -d ' ')
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 platform digests, found $count."
            ls -l /tmp/digests
            exit 1
          fi

          cd /tmp/digests
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Capture manifest digest
        id: inspect
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="latest"
          else
            TAG="edge"
          fi
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "## Multi-arch manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: linux/amd64 + linux/arm64" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 3: Smoke test — boot the published image and verify it actually works.
  # Runs on amd64 (cross-platform smoke test would be slower than the value
  # it adds). Skipped on PRs since we don't push there.
  # ===========================================================================
  smoke-test:
    name: Smoke Test (boot + curl)
    runs-on: ubuntu-latest
    needs: merge
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the just-published image
        run: |
          # Pull the specific tag we just built. Use :latest on tag pushes,
          # :edge on main pushes / manual runs.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="latest"
          else
            TAG="edge"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          docker pull ${{ env.IMAGE_NAME }}:$TAG
          echo "## Smoke testing ${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Boot the container with a fresh SQLite database (no volume mount
      # needed for smoke test). Map port 3000 to the host. The entrypoint
      # creates the schema, so this exercises the same path users get.
      # ----------------------------------------------------------------------
      - name: Boot container
        run: |
          docker run -d \
            --name jobless-joe-smoke \
            -p 3000:3000 \
            -e DATABASE_URL="file:/tmp/smoke.db" \
            -e AI_BACKEND=zai \
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}

          # Wait up to 60 seconds for the healthcheck to pass.
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' jobless-joe-smoke 2>/dev/null || echo "none")
            if [[ "$STATUS" == "healthy" ]]; then
              echo "Container is healthy after ${i}*2s."
              break
            fi
            if [[ "$STATUS" == "unhealthy" ]]; then
              echo "::error::Container marked unhealthy."
              docker logs jobless-joe-smoke
              exit 1
            fi
            sleep 2
          done

          if [[ "$STATUS" != "healthy" ]]; then
            echo "::error::Container did not become healthy within 60s."
            docker logs jobless-joe-smoke
            exit 1
          fi

      - name: Curl endpoints
        run: |
          set -e

          # 1. Home page — should return 200 + HTML containing "Jobless Joe"
          echo "→ GET /"
          CODE=$(curl -s -o /tmp/home.html -w "%{http_code}" http://localhost:3000/)
          echo "  HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "::error::Home page returned $CODE"; exit 1; }
          grep -q "Jobless Joe" /tmp/home.html || { echo "::error::Home page doesn't contain 'Jobless Joe'"; exit 1; }
          echo "  ✓ Home page renders + contains 'Jobless Joe'"

          # 2. Story Bible API — should return 200 + JSON
          echo "→ GET /api/story-bible"
          CODE=$(curl -s -o /tmp/sb.json -w "%{http_code}" http://localhost:3000/api/story-bible)
          echo "  HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "::error::Story Bible API returned $CODE"; exit 1; }
          python3 -c "import json; json.load(open('/tmp/sb.json'))" || { echo "::error::Story Bible response is not valid JSON"; exit 1; }
          echo "  ✓ Story Bible API returns valid JSON"

          # 3. Episodes API — should return 200 + JSON with episodes array
          echo "→ GET /api/episodes"
          CODE=$(curl -s -o /tmp/eps.json -w "%{http_code}" http://localhost:3000/api/episodes)
          echo "  HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "::error::Episodes API returned $CODE"; exit 1; }
          python3 -c "import json; d=json.load(open('/tmp/eps.json')); assert 'episodes' in d, 'missing episodes key'" || { echo "::error::Episodes response malformed"; exit 1; }
          echo "  ✓ Episodes API returns valid JSON"

          # 4. Walls API — should return 200 + JSON with walls array
          echo "→ GET /api/walls"
          CODE=$(curl -s -o /tmp/walls.json -w "%{http_code}" http://localhost:3000/api/walls)
          echo "  HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "::error::Walls API returned $CODE"; exit 1; }
          python3 -c "import json; d=json.load(open('/tmp/walls.json')); assert 'walls' in d, 'missing walls key'" || { echo "::error::Walls response malformed"; exit 1; }
          echo "  ✓ Walls API returns valid JSON"

          # 5. Backend config API
          echo "→ GET /api/backend/config"
          CODE=$(curl -s -o /tmp/cfg.json -w "%{http_code}" http://localhost:3000/api/backend/config)
          echo "  HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "::error::Backend config API returned $CODE"; exit 1; }
          echo "  ✓ Backend config API returns valid JSON"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### All smoke tests passed ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Home page: 200 OK, contains 'Jobless Joe'" >> $GITHUB_STEP_SUMMARY
          echo "- /api/story-bible: 200 OK, valid JSON" >> $GITHUB_STEP_SUMMARY
          echo "- /api/episodes: 200 OK, valid JSON" >> $GITHUB_STEP_SUMMARY
          echo "- /api/walls: 200 OK, valid JSON" >> $GITHUB_STEP_SUMMARY
          echo "- /api/backend/config: 200 OK, valid JSON" >> $GITHUB_STEP_SUMMARY

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "## Container logs (failure)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker logs jobless-joe-smoke 2>&1 | tail -100 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker rm -f jobless-joe-smoke 2>/dev/null || true

  # ===========================================================================
  # Job 4: Sign the image with cosign (keyless, via Sigstore).
  # Uses OIDC token from GitHub Actions to authenticate to Fulcio CA.
  # Signature is recorded in rekor.sigstore.dev transparency log.
  # ===========================================================================
  sign:
    name: Sign Image (cosign keyless)
    runs-on: ubuntu-latest
    needs: [merge, smoke-test]
    if: github.event_name != 'pull_request'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign needs the image digest, not the tag, because tags can move.
      # We reference the digest captured by the merge job.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign image (keyless)
        run: |
          # Sign by digest. cosign keyless uses the OIDC token automatically.
          # The signature goes to GHCR's cosign-specific namespace:
          #   ghcr.io/<owner>/jobless-joe:sha256-<digest>.sig
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}

          echo "## Image signed ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Signature stored at:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify with:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify \\"
          echo "  --certificate-identity-regexp='https://github.com/${{ github.repository }}/.+' \\"
          echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \\"
          echo "  ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify signature (sanity check)
        run: |
          # Verify our own signature to confirm it's valid + in rekor.
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.+" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }} \
            || { echo "::error::Signature verification failed"; exit 1; }
          echo "✓ Signature verified against rekor transparency log"

  # ===========================================================================
  # Job 5: Create GitHub Release with auto-generated notes.
  # Only runs on tag pushes (v*). Skipped on main / PR / manual runs.
  # ===========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [merge, smoke-test, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for changelog generation

      - name: Extract tag name
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # softprops/action-gh-release auto-generates release notes from PRs
      # between the previous tag and this one. Equivalent to clicking
      # "Generate release notes" in the GitHub UI.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Jobless Joe ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            ## 🎙️ Jobless Joe ${{ steps.tag.outputs.name }}

            The Crooner Song Engine — comedy-driven song generator for Jobless Joe's Bootcamp.

            ### Install

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/raw/main/install.sh | bash
            ```

            Or, if you've already cloned the repo:
            ```bash
            ./joe.sh
            ```

            ### What's in this release

            See the auto-generated changelog below for the full diff.

            ### Image

            - Multi-arch: `linux/amd64` + `linux/arm64`
            - Signed with cosign (keyless via Sigstore)
            - `docker pull ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}`

            ### Verify the image

            ```bash
            cosign verify \
              --certificate-identity-regexp='https://github.com/${{ github.repository }}/.+' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
            ```

          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
